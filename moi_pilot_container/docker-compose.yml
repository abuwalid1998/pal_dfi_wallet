version: '3.8'

services:
  moi-national-id:
    build:
      context: .
      dockerfile: Dockerfile
    image: paldi/moi-national-id:pilot-v1.0
    container_name: moi_national_id_pilot
    restart: unless-stopped
    ports:
      - "${MOI_PORT:-9000}:9000"
    volumes:
      # Persistent volume for civil registry records (CSV ledger)
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=9000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - APP_VERSION=1.0.0-pilot
      - CORS_ORIGIN=*
      - MOI_ORGANIZATION=Ministry of Interior - State of Palestine
      - PILOT_ENVIRONMENT=production-pilot
      - GSB_GATEWAY_URL=${GSB_GATEWAY_URL:-http://gsb.gov.ps/api/v1}
      - PMA_ID_PLUS_URL=${PMA_ID_PLUS_URL:-http://idplus.pma.ps/api/v1}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - moi-pilot-net

networks:
  moi-pilot-net:
    driver: bridge
    name: moi-pilot-net
