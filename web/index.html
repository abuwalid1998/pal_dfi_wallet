<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PAL-DFI Citizen & Student Mobile Wallet">

  <!-- Aggressive Anti-Cache Headers for Development & Sandbox Live Testing -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pal_dfi_wallet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PAL-DFI Citizen & Student Wallet</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Ensure any previously cached service workers and cache storage are cleared
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
</head>
<body style="background-color: #080B10; margin: 0;">
  <script>
    // Dynamic cache-busting loader for bootstrap script
    const bootstrapScript = document.createElement('script');
    bootstrapScript.src = 'flutter_bootstrap.js?v=' + Date.now();
    bootstrapScript.async = true;
    document.body.appendChild(bootstrapScript);
  </script>
</body>
</html>
